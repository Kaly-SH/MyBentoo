name: Deploy over SSH

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - closed

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && (github.ref_name == 'main' || github.ref_name == 'develop')


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Déploiement pour la branche : ${{ github.ref_name }}"
            if [ "${{ github.ref_name }}" == "main" ]; then
              bash /var/www/MyBentoo/scripts/deploy.sh prod
            elif [ "${{ github.ref_name }}" == "develop" ]; then
              bash /var/www/MyBentoo/scripts/deploy.sh preprod
            else
              echo "❌ Branche non configurée pour le déploiement : ${{ github.ref_name }}"
              exit 1
            fi
